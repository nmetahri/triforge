name: CI

on:
  pull_request:
  workflow_dispatch:

# A new push to the same pull request cancels the runs of its previous commits
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint installers and tests
        run: shellcheck -x install */install lib/common.sh tests/*.sh

  install:
    needs: shellcheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:stable-slim"]
        components: ["tmux alacritty", "i3"]
    name: install ${{ matrix.components }} on ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Install and verify in a fresh container
        run: tests/run_locally.sh "${{ matrix.image }}" ${{ matrix.components }}
