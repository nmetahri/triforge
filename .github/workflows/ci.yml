name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint installers and tests
        run: shellcheck -x install */install lib/common.sh tests/*.sh

  install:
    needs: shellcheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:stable-slim"]
        components: ["tmux alacritty", "i3"]
    name: install ${{ matrix.components }} on ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Install and verify in a fresh container
        run: tests/run_locally.sh "${{ matrix.image }}" ${{ matrix.components }}
