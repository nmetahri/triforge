# Workspaces Configuration
# This file defines workspace names and application assignments
# Define workspace names with Nerd Font icons
set $ws1 "1: 󰆍 Terminal"
set $ws2 "2:  IDE"
set $ws3 "3:  Browser"
set $ws4 "4:  General"
set $ws5 "5: 󱋊 Social"
set $ws6 "6:  Music"
set $ws7 "7:  Design"
set $ws8 "8:  Media"
set $ws9 "9:  Dev"
set $ws10 "10: 󰢔 Virtual"
# Workspace-to-output assignments (autorandr applies correct xrandr first, i3 restart re-reads these)
# ws1-4, ws6-10: external monitor (DP-1 at work, HDMI-1 at home), fallback to laptop
# ws5: always on laptop screen
workspace $ws1 output DP-1 HDMI-1 eDP-1
workspace $ws2 output DP-1 HDMI-1 eDP-1
workspace $ws3 output DP-1 HDMI-1 eDP-1
workspace $ws4 output DP-1 HDMI-1 eDP-1
workspace $ws5 output eDP-1
workspace $ws6 output DP-1 HDMI-1 eDP-1
workspace $ws7 output DP-1 HDMI-1 eDP-1
workspace $ws8 output DP-1 HDMI-1 eDP-1
workspace $ws9 output DP-1 HDMI-1 eDP-1
workspace $ws10 output DP-1 HDMI-1 eDP-1
# Keyboard bindings for switching workspaces
bindsym $mod+ampersand workspace $ws1
bindsym $mod+eacute workspace $ws2
bindsym $mod+quotedbl workspace $ws3
bindsym $mod+apostrophe workspace $ws4
bindsym $mod+parenleft workspace $ws5
bindsym $mod+minus workspace $ws6
bindsym $mod+egrave workspace $ws7
bindsym $mod+underscore workspace $ws8
bindsym $mod+ccedilla workspace $ws9
bindsym $mod+agrave workspace $ws10
# Keyboard bindings for moving windows to workspaces
bindsym $mod+Shift+ampersand move container to workspace $ws1
bindsym $mod+Shift+eacute move container to workspace $ws2
bindsym $mod+Shift+quotedbl move container to workspace $ws3
bindsym $mod+Shift+apostrophe move container to workspace $ws4
bindsym $mod+Shift+5 move container to workspace $ws5
bindsym $mod+Shift+minus move container to workspace $ws6
bindsym $mod+Shift+egrave move container to workspace $ws7
bindsym $mod+Shift+underscore move container to workspace $ws8
bindsym $mod+Shift+ccedilla move container to workspace $ws9
bindsym $mod+Shift+agrave move container to workspace $ws10
# ============================================================
# APPLICATION ASSIGNMENTS
# ============================================================
# Terminal (Workspace 1)
assign [class="Alacritty"] $ws1
assign [class="XTerm"] $ws1
assign [class="URxvt"] $ws1
# Development & Coding (Workspace 2)
assign [class="Code" instance="code"] $ws2
assign [class="VSCodium"] $ws2
assign [class="jetbrains-.*"] $ws2
assign [class="Geany"] $ws2
assign [class="gedit"] $ws2
# Text Editors (Workspace 2)
assign [class="Gedit"] $ws2
assign [class="Mousepad"] $ws2
assign [class="Pluma"] $ws2
assign [class="sublime.*"] $ws2
assign [class="atom"] $ws2
# Web Browsers (Workspace 3)
assign [class="Firefox"] $ws3
assign [class="Chromium-browser"] $ws3
assign [class="Google-chrome"] $ws3
assign [class="Google-Chrome"] $ws3
assign [class="Brave-browser"] $ws3
# File Managers (Workspace 4)
assign [class="Thunar"] $ws4
assign [class="Nemo"] $ws4
assign [class="PCManFM"] $ws4
assign [class="Caja"] $ws4
assign [class="org.gnome.Nautilus"] $ws4
# Communication & Chat (Workspace 5)
assign [class="Slack"] $ws5
assign [class="discord"] $ws5
assign [class="Discord"] $ws5
assign [class="zoom"] $ws5
assign [class="Zoom"] $ws5
assign [class="Telegram"] $ws5
assign [class="TelegramDesktop"] $ws5
# Music & Audio (Workspace 6)
assign [class="Spotify"] $ws6
assign [class="spotify"] $ws6
assign [class="vlc"] $ws6
assign [class="VLC"] $ws6
assign [class="Audacity"] $ws6
assign [class="Cmus"] $ws6
# Tools & Utilities (Workspace 7)
assign [class="Blender"] $ws7
assign [class="Gimp"] $ws7
assign [class="Inkscape"] $ws7
assign [class="Krita"] $ws7
assign [class="OBS"] $ws7
assign [class="obs"] $ws7
assign [class="qemu-system-x86_64"] $ws7
# Media & Graphics (Workspace 8)
assign [class="Geeqie"] $ws8
assign [class="Feh"] $ws8
assign [class="Darktable"] $ws8
assign [class="Dia"] $ws8
assign [class="mpv"] $ws8
# Work & Office (Workspace 9)
assign [class="libreoffice.*"] $ws9
assign [class="libreoffice-calc"] $ws9
assign [class="libreoffice-writer"] $ws9
assign [class="evolution"] $ws9
assign [class="thunderbird"] $ws9
assign [class="Thunderbird"] $ws9
# Other Applications (Workspace 10)
assign [class="VirtualBox Manager"] $ws10
assign [class="VirtualBox Machine"] $ws10
assign [class="qemu-.*"] $ws10
assign [class="KVM"] $ws10
